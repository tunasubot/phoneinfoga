version: '3.8'

services:
  phoneinfoga:
    image: sundowndev/phoneinfoga:latest
    container_name: phoneinfoga
    ports:
      - "5000:5000"
    command: serve -p 5000
    networks:
      - phoneinfoga-network

  phoneinfoga-mcp:
    build:
      context: ../..
      dockerfile: mcp-server/Dockerfile
    container_name: phoneinfoga-mcp
    depends_on:
      - phoneinfoga
    environment:
      - PHONEINFOGA_API_URL=http://phoneinfoga:5000
    networks:
      - phoneinfoga-network
    stdin_open: true
    tty: true

networks:
  phoneinfoga-network:
    driver: bridge
